# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ==========================================
# JVM Memory Settings (Optimized for 8GB RAM)
# ==========================================
# Conservative allocation: 2560m max heap, leaving ~5.4GB for OS + IDE + browser
# Max heap increased from 2048m to 2560m for better build performance
# Initial heap: 512m for faster startup
# Metaspace: 512m for Kotlin metadata and plugin classes
org.gradle.jvmargs=-Xmx2560m -Xms512m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# ==========================================
# Gradle Daemon Settings
# ==========================================
# Enable daemon for faster subsequent builds (reuses JVM process)
org.gradle.daemon=true

# ==========================================
# Configuration Cache (Gradle 8.x)
# ==========================================
# Enables configuration cache for ~30% faster configuration phase
# Stores task graph and configuration results
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# ==========================================
# Parallel Execution
# ==========================================
# Disabled for single-module projects and 8GB RAM constraint
# Enable only if you have multi-module project and >12GB RAM
org.gradle.parallel=false

# ==========================================
# File System Watching
# ==========================================
# Enables incremental build optimization via file system monitoring
# Gradle watches for file changes to avoid unnecessary recompilation
org.gradle.vfs.watch=true

# ==========================================
# Build Cache
# ==========================================
# Local build cache enabled (stores compiled outputs for reuse)
# Remote cache disabled (requires additional server setup)
org.gradle.caching=true

# ==========================================
# Kotlin Compiler Optimizations
# ==========================================
# Incremental compilation for faster rebuilds
kotlin.incremental=true
# Precise Java tracking for better incremental compilation accuracy
kotlin.incremental.usePreciseJavaTracking=true
# Kotlin code style
kotlin.code.style=official

# ==========================================
# Android Configuration
# ==========================================
# AndroidX package structure
android.useAndroidX=true
# Non-transitive R classes (reduces R class size)
android.nonTransitiveRClass=true